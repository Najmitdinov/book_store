name: book_store
description: "Kitobxon — Flutter va Firebase asosidagi zamonaviy kitob do'koni."
publish_to: "none"

version: 2.0.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: any # versiyani flutter_localizations belgilaydi
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_colorpicker: ^1.1.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Maat_Rounded
      fonts:
        - asset: assets/fonts/Maat_Rounded.otf
